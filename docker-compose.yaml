services:
  postgres:
    image: postgres:16
    container_name: ros2-postgres
    environment:
      POSTGRES_DB: Cijfer_Admin_DB
      POSTGRES_USER: ros2-user
      POSTGRES_PASSWORD: ros2-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
